name: security-scan

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.repository }}
  cancel-in-progress: false

jobs:
  semgrep:
    runs-on: semgrep
    steps:
      - name: clonar
        run: git clone --depth 1 --branch main "http://token:${{ secrets.GITHUB_TOKEN }}@127.0.0.1:3000/sakae/Pre-Sales-Compliance-Platform.git" .
      - name: semgrep
        run: |
          semgrep scan --config auto --json --output=.semgrep.json . || true
          python3 scripts/ci/semgrep_summary.py >> "$FORGEJO_STEP_SUMMARY"
      - name: Gerando relatório de achados (painel Infra Ops)
        run: python3 scripts/ci/infraops_findings.py semgrep .semgrep.json || true
      - name: semgrep (gate)
        run: semgrep scan --config auto --error .

  trivy:
    runs-on: trivy
    steps:
      - name: clonar
        run: git clone --depth 1 --branch main "http://token:${{ secrets.GITHUB_TOKEN }}@127.0.0.1:3000/sakae/Pre-Sales-Compliance-Platform.git" .
      - name: trivy fs
        run: |
          apk add --no-cache python3 >/dev/null
          # MEDIUM entra no RELATÓRIO (a política do gate trata MEDIUM como aviso), mas NÃO no
          # gate abaixo, que continua bloqueando só em HIGH/CRITICAL. O que muda é o que o painel
          # enxerga, não o que reprova o merge.
          trivy fs --scanners vuln --severity CRITICAL,HIGH,MEDIUM --format json --output .trivy.json . || true
          python3 scripts/ci/trivy_summary.py >> "$FORGEJO_STEP_SUMMARY"
      - name: Gerando relatório de achados (painel Infra Ops)
        run: python3 scripts/ci/infraops_findings.py trivy .trivy.json || true
      - name: trivy (gate)
        run: trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 .
