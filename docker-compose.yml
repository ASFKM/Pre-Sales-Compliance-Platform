version: '3.8'

services:
  # 1. Main Full-Stack Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: commercial-assistant-ai:latest
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SECRET_ENCRYPTION_KEY=${SECRET_ENCRYPTION_KEY}
      - JWT_SESSION_SECRET=${JWT_SESSION_SECRET}
      - DATABASE_URL=postgresql://app_user:${POSTGRES_PASSWORD}@postgres:5432/commercial_assistant
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - STORAGE_MODE=local # Switch to 's3' or 'gcs' from the Admin Console storage panel when ready
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    # F8b (item 3): read_only: true finalmente aplicado à imagem própria, depois da auditoria de
    # write path que a F7 exigia antes de virar o flag - e depois de rodar a imagem REAL com ele.
    #
    # O que a auditoria do código encontrou:
    #   - Arquivo de proposta (DOCX/PDF): NÃO passa por arquivo temporário. buildDocxBuffer/
    #     buildPdfBuffer devolvem Buffer em memória e writeProposalFiles (server/utils/docx.ts)
    #     entrega o Buffer direto ao StorageAdapter; o merge no template (docxtemplater,
    #     server/utils/docxTemplateEngine.ts) também é Buffer -> Buffer. Não há LibreOffice, nem
    #     zip em disco, nem diretório de conversão.
    #   - Upload de documento/template/planilha: todos os multer deste servidor usam
    #     memoryStorage() (documents.ts, templates.ts, pocs.ts, projectIntake.ts,
    #     diagnosticsAgent.ts) - nenhum arquivo temporário do multer toca o disco.
    #   - Única escrita persistente do processo: o LocalStorageAdapter, sempre sob `uploads`
    #     (proposta gerada, documento enviado, template registrado sob uploads/templates, e a
    #     sonda .storage-health-check de GET /settings/storage/status) - que é o bind mount logo
    #     abaixo, e continua gravável com read_only ligado. Com STORAGE_MODE=s3/gcs nem isso.
    #   - Log: pino escreve em stdout em produção (server/utils/logger.ts), nunca em arquivo.
    #
    # Medido na imagem real, com o rootfs somente-leitura: gerar proposta do zero (DOCX+PDF
    # escritos no bind mount), exportar o DOCX pela rota, e reabrir a proposta rejeitada - inclusive
    # a reabertura de um relatório, que chama o provedor de IA e regenera a seção - funcionam sem
    # um único EROFS/EACCES. `npm audit --json`, que roda em runtime a cada heartbeat do Fleet
    # Manager (performVulnerabilityScan em server/utils/fleetLicense.ts), também roda: foi medido
    # com o rootfs somente-leitura e SEM tmpfs nenhum, e sai 0 - ele não precisa de cache gravável
    # para essa subcomando. Ou seja: a aplicação, hoje, não escreve fora de `uploads`.
    #
    # O /tmp abaixo é, então, seguro-desemprego declarado, não necessidade medida: é para onde
    # os.tmpdir() aponta, e é onde uma dependência que este teste não exercita (o cliente do GCS
    # num upload retomável, um escritor em fluxo do exceljs) tentaria escrever. Um EROFS ali cairia
    # dentro de um catch que devolve `null` e some, que é justamente o tipo de falha silenciosa que
    # este repositório já pagou caro. Custa nada e não guarda estado - nada aqui precisa sobreviver
    # ao container; o que precisa durar está no bind mount de uploads.
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./uploads:/app/uploads

  # 2. Secure Relational Database
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=commercial_assistant
      - POSTGRES_USER=app_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/certs/server.crt", "-c", "ssl_key_file=/certs/server.key"]
    ports:
      - "127.0.0.1:5432:5432"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    volumes:
      - pgdata:/var/lib/postgresql/data
      - /etc/postgresql-certs:/certs:ro
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d commercial_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Redis Cache / Session Store
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [
      "redis-server",
      "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}",
      "--port", "6379",
      "--tls-port", "6380",
      "--tls-cert-file", "/certs/server.crt",
      "--tls-key-file", "/certs/server.key",
      "--tls-ca-cert-file", "/certs/ca.crt",
      "--tls-auth-clients", "no"
    ]
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:6380:6380"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - redisdata:/data
      - /etc/redis-certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Local S3-compatible storage for testing the real S3StorageAdapter without AWS
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minio_admin
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt

volumes:
  pgdata:
  redisdata:
  miniodata:
