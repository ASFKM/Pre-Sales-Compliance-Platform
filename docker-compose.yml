version: '3.8'

services:
  # 1. Main Full-Stack Application
  # PENDÊNCIA REGISTRADA (não é falso positivo - achado real, adiado de propósito): read_only na
  # imagem própria (diferente de postgres/redis/minio abaixo, já validados ao vivo) exige antes
  # auditar todo write path do código (temp de zip/docx, etc) e testar a imagem real - ver a nota
  # completa no comentário de security_opt logo abaixo e no fechamento da fase F7. Sinalizado pro
  # dono decidir se vira fase própria.
  app: # nosemgrep: yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service
    build:
      context: .
      dockerfile: Dockerfile
    image: commercial-assistant-ai:latest
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SECRET_ENCRYPTION_KEY=${SECRET_ENCRYPTION_KEY}
      - JWT_SESSION_SECRET=${JWT_SESSION_SECRET}
      - DATABASE_URL=postgresql://app_user:${POSTGRES_PASSWORD}@postgres:5432/commercial_assistant
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - STORAGE_MODE=local # Switch to 's3' or 'gcs' from the Admin Console storage panel when ready
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    # read_only: true (added to postgres/redis/minio below, validated live) is deliberately NOT
    # set here yet - this is the custom-built app image, and confirming every write path it needs
    # (uploads is already the bind mount above, but temp files from zip/docx generation, npm/
    # esbuild output, etc. aren't audited yet) needs its own validation pass building and smoke-
    # testing the real image, not a blind flag flip on a customer-facing deployment file. Tracked
    # as a follow-up, not silently dropped - see the F7 phase closing notes.
    volumes:
      - ./uploads:/app/uploads

  # 2. Secure Relational Database
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=commercial_assistant
      - POSTGRES_USER=app_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/certs/server.crt", "-c", "ssl_key_file=/certs/server.key"]
    ports:
      - "127.0.0.1:5432:5432"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    volumes:
      - pgdata:/var/lib/postgresql/data
      - /etc/postgresql-certs:/certs:ro
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d commercial_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Redis Cache / Session Store
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [
      "redis-server",
      "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}",
      "--port", "6379",
      "--tls-port", "6380",
      "--tls-cert-file", "/certs/server.crt",
      "--tls-key-file", "/certs/server.key",
      "--tls-ca-cert-file", "/certs/ca.crt",
      "--tls-auth-clients", "no"
    ]
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:6380:6380"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - redisdata:/data
      - /etc/redis-certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Local S3-compatible storage for testing the real S3StorageAdapter without AWS
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minio_admin
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt

volumes:
  pgdata:
  redisdata:
  miniodata:
